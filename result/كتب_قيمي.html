<!doctype html><html lang="ar" dir="rtl"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>كتب قيمي: الصفحة والنص</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<style>
  /* Layout: book tabs + page rail on top, then the scanned page and its OCR text side by side (stacked on phones). */
  :root {
    --bg: #f3f5f7; --panel: #ffffff; --ink: #18222d; --muted: #5b6774; --line: #dbe1e7;
    --accent: #0f6e78; --accent-soft: #dcefef; --good: #2f7d4f; --warn: #a8650c; --low: #9aa6b2;
    --ui: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
    --read: "Noto Naskh Arabic", "Traditional Arabic", "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #11171d; --panel: #18212a; --ink: #e5ebf0; --muted: #98a6b3; --line: #2a3642;
    --accent: #5cc3cc; --accent-soft: #173b40; --good: #6cc48f; --warn: #e2a14a; --low: #5d6b78; color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #11171d; --panel: #18212a; --ink: #e5ebf0; --muted: #98a6b3; --line: #2a3642;
    --accent: #5cc3cc; --accent-soft: #173b40; --good: #6cc48f; --warn: #e2a14a; --low: #5d6b78; color-scheme: dark }
  body { background: var(--bg); color: var(--ink); font-family: var(--ui); }
  .wrap { direction: rtl; max-width: 1400px; margin: 0 auto; padding-block: 20px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 16px; }
  h1 { margin: 0; font-size: 1.5rem; font-weight: 600; text-wrap: balance; }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; }
  .tab { font: inherit; font-size: 1rem; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); font-weight: 600; }
  .tab small { opacity: .75; font-size: .8rem; margin-inline-start: 6px; }
  .rail { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { font: inherit; font-size: .8rem; min-width: 34px; padding: 4px 0 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; position: relative; font-variant-numeric: tabular-nums; }
  .chip i { position: absolute; inset: auto 4px 2px; height: 3px; border-radius: 2px; background: var(--accent); }
  .chip.lowp i { background: var(--low); }
  .chip[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; justify-content: space-between; }
  .nav { display: flex; align-items: center; gap: 8px; }
  .btn { font: inherit; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
  .btn:disabled { opacity: .4; cursor: default; }
  .pg { font-weight: 600; font-variant-numeric: tabular-nums; min-width: 8ch; text-align: center; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { font-size: .82rem; padding: 4px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); font-variant-numeric: tabular-nums; }
  .pill b { color: var(--ink); font-weight: 600; }
  .pill.good b { color: var(--good); }
  .pill.low b { color: var(--warn); }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .grid.wide { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); }
  @media (max-width: 860px) { .grid, .grid.wide { grid-template-columns: minmax(0, 1fr); } }
  .pane { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-width: 0; display: flex; flex-direction: column; }
  .pane-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: .85rem; color: var(--muted); }
  .pane-h strong { color: var(--ink); font-weight: 600; font-size: .95rem; }
  .scan { padding: 10px; display: flex; justify-content: center; }
  .scan img { width: 100%; height: auto; border-radius: 4px; background: var(--line); display: block; cursor: zoom-in; }
  .scan.zoom img { cursor: zoom-out; }
  .scanbox { overflow: auto; max-height: 80vh; }
  .scan.zoom img { width: 200%; max-width: none; }
  .ocr { font-family: var(--read); font-size: var(--fs, 1.35rem); line-height: 2.1; padding: 16px 20px 24px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; max-height: 80vh; overflow: auto; }
  .tools { display: flex; gap: 6px; }
  .tools .btn { padding: 3px 10px; font-size: .85rem; }
  .btn:focus-visible, .tab:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hint { color: var(--muted); font-size: .8rem; }
  .state { padding: 40px; text-align: center; color: var(--muted); }
</style>

<div class="wrap">

  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="rail" id="rail" aria-label="الصفحات"></div>

  <div class="bar">
    <div class="nav">
      <button class="btn" id="prev" type="button">→ السابقة</button>
      <span class="pg" id="pg">—</span>
      <button class="btn" id="next" type="button">التالية ←</button>
    </div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="grid" id="grid">
    <section class="pane" aria-label="صفحة الـ PDF">
      <div class="pane-h"><strong>الـ PDF</strong><span class="hint">دوس على الصورة عشان تكبرها</span></div>
      <div class="scanbox"><div class="scan" id="scan"><div class="state">بيحمّل…</div></div></div>
    </section>
    <section class="pane" aria-label="نص الـ OCR">
      <div class="pane-h"><strong>نص الـ OCR</strong>
        <div class="tools">
          <button class="btn" id="smaller" type="button" aria-label="صغّر الخط">أ−</button>
          <button class="btn" id="bigger" type="button" aria-label="كبّر الخط">أ+</button>
          <button class="btn" id="copy" type="button">انسخ النص</button>
        </div>
      </div>
      <pre class="ocr" id="ocr" lang="ar" dir="rtl"></pre>
    </section>
  </div>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  let BOOKS = [], book = 0, page = 0, fs = 1.35;
  const pct = (x) => Math.round(x * 100) + '%';

  function fromHash() {
    const m = /^#(.+)-(\d+)$/.exec(decodeURIComponent(location.hash));
    if (!m) return;
    const b = BOOKS.findIndex((x) => x.key === m[1]);
    if (b < 0) return;
    book = b;
    const p = BOOKS[b].pages.findIndex((x) => x.n === +m[2]);
    page = p < 0 ? 0 : p;
  }
  function setHash() {
    const h = '#' + encodeURIComponent(BOOKS[book].key + '-' + BOOKS[book].pages[page].n);
    if (location.hash !== h) history.replaceState(null, '', h);
  }

  function renderTabs() {
    $('tabs').replaceChildren(...BOOKS.map((b, i) => {
      const t = document.createElement('button');
      t.className = 'tab'; t.type = 'button'; t.setAttribute('role', 'tab');
      t.setAttribute('aria-selected', String(i === book));
      t.textContent = b.title;
      const s = document.createElement('small'); s.textContent = b.pages.length + ' صفحة'; t.appendChild(s);
      t.onclick = () => { book = i; page = 0; render(); };
      return t;
    }));
  }
  function renderRail() {
    const pages = BOOKS[book].pages;
    $('rail').replaceChildren(...pages.map((p, i) => {
      const c = document.createElement('button');
      c.className = 'chip' + (p.diac < 0.3 ? ' lowp' : ''); c.type = 'button';
      c.textContent = p.n; c.title = 'صفحة ' + p.n + ' · تشكيل ' + pct(p.diac);
      if (i === page) c.setAttribute('aria-current', 'true');
      c.appendChild(document.createElement('i'));
      c.onclick = () => { page = i; render(); };
      return c;
    }));
  }
  function renderPage() {
    const b = BOOKS[book], p = b.pages[page];
    $('grid').className = 'grid' + (p.w > p.h ? ' wide' : '');
    $('pg').textContent = 'صفحة ' + p.n + ' من ' + b.pages.length;
    $('prev').disabled = page === 0; $('next').disabled = page === b.pages.length - 1;
    const img = document.createElement('img');
    img.src = p.img; img.alt = b.title + ' صفحة ' + p.n; img.width = p.w; img.height = p.h;
    img.onclick = () => $('scan').classList.toggle('zoom');
    img.onerror = () => { $('scan').replaceChildren(Object.assign(document.createElement('div'), { className: 'state', textContent: 'الصورة ما اتحملتش. جرّب تفتح الصفحة تاني.' })); };
    $('scan').classList.remove('zoom');
    $('scan').replaceChildren(img);
    $('ocr').textContent = p.text;
    $('ocr').scrollTop = 0;
    const pills = [];
    if (p.score) {
      pills.push(['دقة الحروف', (p.score.letters * 100).toFixed(1) + '%', 'good']);
      pills.push(['دقة التشكيل', (p.score.tashkeel * 100).toFixed(1) + '%', 'good']);
    }
    $('stats').replaceChildren(...pills.map(([k, v, cls]) => {
      const s = document.createElement('span'); s.className = 'pill ' + cls;
      s.append(k + ': '); const bb = document.createElement('b'); bb.dir = 'ltr'; bb.textContent = v; s.appendChild(bb); return s;
    }));
    // preload neighbours
    [page - 1, page + 1].forEach((i) => { const q = b.pages[i]; if (q) { const im = new Image(); im.src = q.img; } });
  }
  function render() { renderTabs(); renderRail(); renderPage(); setHash(); }

  $('prev').onclick = () => { if (page > 0) { page--; render(); } };
  $('next').onclick = () => { if (page < BOOKS[book].pages.length - 1) { page++; render(); } };
  $('bigger').onclick = () => { fs = Math.min(2.4, fs + 0.15); $('ocr').style.setProperty('--fs', fs + 'rem'); };
  $('smaller').onclick = () => { fs = Math.max(0.9, fs - 0.15); $('ocr').style.setProperty('--fs', fs + 'rem'); };
  $('copy').onclick = () => {
    const t = $('ocr').textContent, btn = $('copy');
    const done = (ok) => { btn.textContent = ok ? 'اتنسخ' : 'حدد النص وانسخه'; setTimeout(() => { btn.textContent = 'انسخ النص'; }, 1600); };
    try {
      navigator.clipboard.writeText(t).then(() => done(true), () => { selectText(); done(false); });
    } catch (e) { selectText(); done(false); }
  };
  function selectText() { const r = document.createRange(); r.selectNodeContents($('ocr')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  document.addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('input,textarea')) return;
    // RTL book: left arrow = next page
    if (e.key === 'ArrowLeft') $('next').click();
    if (e.key === 'ArrowRight') $('prev').click();
  });
  window.addEventListener('hashchange', () => { fromHash(); render(); });

  BOOKS = [{"key": "الأمانة", "title": "الأمانة", "pages": [{"n": 1, "img": "الأمانة/images/p001.png", "w": 1700, "h": 2200, "words": 6, "diac": 0.6, "score": null, "text": "قيمي\nالأَمَانَةُ\nبِنَاءُ شَخْصِيَتِك و مُعْتَقَدَاتِك"}, {"n": 2, "img": "الأمانة/images/p002.png", "w": 1654, "h": 2339, "words": 178, "diac": 0.058, "score": null, "text": "قيمي\nالأَمَانَةُ\nالأمانة هي أول درس في كتاب الحكمة، إن تعليم هذه الصفة الحميدة الأمانة والإخلاص لطفلك سوف يستغرق\nوقتا ويحتاج إلى صبر. يجب أن يتعلم طفلك أو طفلتك كيف يكون مخلصا، محل ثقة صادقًا وصريحٌ. والآن سهل\nعلى طفلك معرفة الحقيقة عن طريقة هذه القصص القصيرة سهلة الفهم. ستشجعه هذه القصص الملونة على\nفهم ميزة قول الحقيقة، وستعلمه كيف يكون أمينا، ليس فقط مع غيره، لكن أيضا مع نفسه.\nكل العناوين في هذه السلسلة\nقيمي\nالأَمَانَةُ\nبناء شخصيتك و معتقداتك\nمؤسسة حورس الدولية\nقيمي\nالتعاطف\nبناء شخصيتك و معتقداتك\nمؤسسة حورس الدولية\nقيمي\nالشَّجَاعَة\nبناء شخصيتك و معتقداتك\nمؤسسة حورس الدولية\nقيمي\nالصَّبْرُ\nبناء شخصيتك و معتقداتك\nمؤسسة حورس الدولية\nقيمي\nالغَضَبُ والجدالُ\nبناء شخصيتك و معتقداتك\nمؤسسة حورس الدولية\nقيمي\nالقَنَاعَةُ\nبناء شخصيتك و معتقداتك\nمؤسسة حورس الدولية\nقيمي\nقُوَّةُ الكَلِمَةِ\nبناء شخصيتك و معتقداتك\nمؤسسة حورس الدولية\nقيمي\nالأنَانِيَّةُ\nبناء شخصيتك و معتقداتك\nمؤسسة حورس الدولية\nقيمي\nالتَّسَامُحُ\nبناء شخصيتك و معتقداتك\nمؤسسة حورس الدولية\nقيمي\nالغَيْرَةُ\nبناء شخصيتك و معتقداتك\nمؤسسة حورس الدولية\nI.S.B.N\n978-977-368-637-6\n9789773686376\nFu2\nearn\nالريادة\nللدراسات والنشر\nمؤسسة حورس الدولية"}, {"n": 3, "img": "الأمانة/images/p003.png", "w": 1654, "h": 2339, "words": 107, "diac": 0.221, "score": null, "text": "قِيَمِي\n\nالأَمَانَةُ\n\nالمُحْتَوَى\n\n6 - 2\tوَظِيفَةُ يَومِ العُطْلَةِ\n11 - 7\tالحَقِيبَةُ المَفْقُودَةُ\n16 - 12\tامْتِحَانُ التَّهْجِئَةِ\n21 - 17\tلا نُرِيدُ أَنْ نَدْرُسَ\n24 - 22\tلِمَنْ هَذِهِ النُّقُودُ؟\n\nترجمة كتاب : values for me\nبتصريح من شركة : future books\nthis edition has been produced with a subsidy by the spotlight on\nright programme in Abu Dhabi\nالناشر : مؤسسة حورس الدولية للنشر والتوزيع\nالريادة للنشر والطباعة - دبي - الأمارات العربية المتحدة\nرقم الإيداع بدار الكتب : 14814\nالترقيم الدولي I.S.B.N : 2 - 635 - 368 - 977 - 978\nجميع الحقوق محفوظة لمؤسسة حورس الدولية للنشر والتوزيع\nطبعة : 2019"}, {"n": 4, "img": "الأمانة/images/p004.png", "w": 1654, "h": 2339, "words": 36, "diac": 0.783, "score": {"letters": 1.0, "words": 1.0, "tashkeel": 0.9609, "reference": "score_ocr.GT"}, "text": "وَظِيفَةُ يَوْمِ العُطْلَةِ\n\nكَانَ «عَاصِمٌ» وَ«يَاسِرٌ» رَفِيقَيْنِ بِصَفٍّ وَاحِدٍ، وَصَدَقَينِ جَيِّدَيْنِ، وَكَانُوا\nمُتَحَمِّسِينَ جدًّا لِعُطْلَةِ الصَّيفِ. أَعْطَتْهُمَا مُعَلِّمَةُ الصَّفِّ فروضًا مَنزِلِيَّة\nخِلَالَ العُطْلَةِ، وَقَالَتْ لَهُمَا: «استَمْتِعَا بِالعُطْلَةِ، لَكِنْ لا تَنْسَيَا أَنْ تُنْهِيَا\nفُرُوضَكُما المَنْزِلِيَّةَ فِي وَقْتِهَا»."}, {"n": 5, "img": "الأمانة/images/p005.png", "w": 1654, "h": 2339, "words": 28, "diac": 0.758, "score": {"letters": 1.0, "words": 1.0, "tashkeel": 0.9588, "reference": "score_ocr.GT"}, "text": "فِي المَنْزِلِ سَأَلَ «عَاصِمٌ» وَالِدَتَهُ: «أُمِّي هَلَّا سَاعَدْتِنِي لَوْ سَمَحْتِ\nبِالفُرُوضِ المَنْزِلِيَّةِ في العُطْلَةِ ؟ أُرِيدُ أَنْ أُنْهِيَهَا الآنَ وَأَسْتَمْتِعَ بِالعُطْلَةِ».\nوَافَقَتْ وَالِدَتُهُ وَسَاعَدَتْهُ في إِنْهَاءِ الفُرُوضِ المَنْزِلِيَّةِ."}, {"n": 6, "img": "الأمانة/images/p006.png", "w": 1654, "h": 2339, "words": 25, "diac": 0.685, "score": null, "text": "فِي المَسَاءِ، جَاءَ «يَاسِرُ» إِلَىَ مَنْزِلِ «عَاصِمٍ» وَسَأَلَهُ: «هَلَّا أَعْطَيْتَنِي\nدَفْتَرَ الفُرُوضِ المَنْزِلِيَّةِ الخَاصَّ بِكَ؟ أَحْتَاجُ بَعْضَ المُسَاعَدَةِ». أَعَارَهُ\n«عَاصِمٌ» الدَّفْتَرَ.\n\n| وظيفة يوم العطلة"}, {"n": 7, "img": "الأمانة/images/p007.png", "w": 1654, "h": 2339, "words": 40, "diac": 0.808, "score": null, "text": "فِي الحَقِيقَةِ، لَمْ يَرْغَبْ «يَاسِرُ» بِأَنْ يَكُونَ مُجِدًّا وَفَكَّرَ أَنَّهُ يُمْكِنُهُ أَنْ\nيَنْسَخَ فُرُوضَ «عَاصِم» المَنْزِلِيَّةَ، كَمَا هِيَ. بَيْنَمَا هُوَ يَنْسَخُ أَتَتْ وَالِدَتُهُ\nوَرَأَتْ كُلَّ شَيْءٍ. قَالَتْ لَهُ: «يَاسِرُ هَذَا لَيْسَ عَمَلًا جَيِّدًا. أَنْ تَنْسَخَ فُرُوضَ\nأَحَدِهِمْ!».\n\nوظيفة يوم العطلة"}, {"n": 8, "img": "الأمانة/images/p008.png", "w": 1654, "h": 2339, "words": 41, "diac": 0.829, "score": null, "text": "تَابَعَتْ وَالِدَتُهُ طِفْلِي العَزِيزُ لَنْ تَكُونَ صَادِقًا مَعَ مُعَلِّمَتِكَ عِنْدَمَا تَقُولُ لَهَا اَنَّكَ اَدَّيْتَ فُرُوضِكَ المَنْزِلِيَّةِ بِنَفْسِكَ لَكِنْ فِي الوَاقِعِ اَنْتَ نَسَخْتَهَا تَفَهَّمَ يَاسِرُ وَوَعَدَ اَنْ يُعِيدَ دَفْتَرَ عَاصِمٍ عِنْدَهَا سَاعَدَتْهُ اُمُّهُ فِي اِنْهَاءِ فُروضِهِ المَنْزِلِيَّةِ العِبْرَةُ كُنْ اَمِينًا وَمُخْلِصًا دَائِمًا"}, {"n": 9, "img": "الأمانة/images/p009.png", "w": 1654, "h": 2339, "words": 40, "diac": 0.798, "score": null, "text": "اَلحَقِيبَةُ المَفْقُودَةُ\n\nفَكَّرَ «شَادِي» وَهُوَ عَائِدٌ مِنَ المَدْرَسَةِ «أُمِّي لا تَمْلِكُ النُّقُودَ لِتَدْفَعَ رُسُومَ\nالمَدْرَسَةِ. أَعْتَقِدُ أَنَّهُ يَجِبُ أَنْ أَتْرُكَ المَدْرَسَةَ». فَجْأَةً، رَأَى حَقِيبَةً كَبِيرَةً\nمَرْمِيَّةً عَلَى الطَّرِيقِ. فَكَّرَ: «كَمْ مِنَ الوَقْتِ وَالحَقِيبَةُ مَرْمِيَّةٌ هُنَا؟ لا أَرَى\nأَحَدًا». التَقَطَ الحَقِيبَةَ."}, {"n": 10, "img": "الأمانة/images/p010.png", "w": 1654, "h": 2339, "words": 27, "diac": 0.744, "score": null, "text": "عِنْدَمَا وَصَلَ المَنْزِلَ أَعْطَى الحَقِيبَةَ لِوَالِدَتِهِ. عِنْدَمَا فَتَحَتِ الحَقِيبَةَ\nانْدَهَشَتْ: «أُوهِ يَا الله! كُلُّ هَذِهِ النُّقُودِ هُنَا. انْتَظِرْ! هُنَا بِطَاقَةٌ أَيْضًا،\nوَعَلَيْهَا عُنْوَانٌ. تَعَالَ «شَادِي» دَعْنَا نَذْهَبْ»."}, {"n": 11, "img": "الأمانة/images/p011.png", "w": 1654, "h": 2339, "words": 29, "diac": 0.752, "score": null, "text": "كَانَ الْعُنْوَانُ هُوَ لِلسَّيِّدِ «مِينَا» وَهُوَ مَالِكُ لمَصْنَعٍ. سَلَّمَ «شَادِي» وَوَالِدَتُهُ\nالحَقِيبَةَ لَهُ، فَقَالَ لَهُمَا: «أوه! أَنْتُمَا وَجَدْتُمَا هَذِهِ الحَقِيبَةَ! سَقَطَتْ مِنِّي\nبَيْنَمَا أَنَا فِي طَرِيقِي للمَصْنَعِ. شُكْرًا كَثِيرًا!»."}, {"n": 12, "img": "الأمانة/images/p012.png", "w": 1654, "h": 2339, "words": 32, "diac": 0.792, "score": null, "text": "عَرَفَ السَّيِّدُ «مِينَا» أَنَّهُمْ فُقَرَاءُ. أَعْطَى وَالِدَةَ «شَادِي» نُقُودًا، قَائِلًا لَهَا:\n«مِنْ فَضْلِكِ خُذِي هَذِهِ النُّقُودَ هَذَا جُزْءٌ بَسِيطٌ مِنْ شُكْرِي لَكُمَا. وَأَعِدُكِ\nعِنْدَمَا يَكْبُرُ «شَادِي» سَيَكُونُ لَهُ عَمَلٌ عِنْدِي فِي المَصْنَعِ»."}, {"n": 13, "img": "الأمانة/images/p013.png", "w": 1654, "h": 2339, "words": 28, "diac": 0.761, "score": null, "text": "كَانَتْ وَالِدَةُ شَادِي سَعِيدَةً جِدًّا، وَفَكَّرَتْ: «الآنَ يُمْكِنُنِي أَنْ أَدْفَعَ رُسُومَ\nالمَدْرَسَةِ». ذَهَبَا مَعَ بَعْضٍ إِلَى السُّوقِ وَاشْتَرَيَا ثِيَابًا جَدِيدَةً وَحَقِيبَةً\nلِلمَدْرَسَةِ وَدَرَّاجَةً «لِشَادِي».\n\nالعِبْرَةُ: الأَمَانَةُ دَائِمًا تُكَافَأُ."}, {"n": 14, "img": "الأمانة/images/p014.png", "w": 1654, "h": 2339, "words": 25, "diac": 0.772, "score": null, "text": "اِمْتِحَانُ التَّهْجِئَةِ\n\nكَانَ «هَاني» جَيِّدًا جِدًّا فِي تَعَلُّمِ تَهْجِئَةِ الكَلِمَاتِ بِالشَّكْلِ الصَّحِيحِ. فَقَدِ\nاعْتَادَ الكِتَابَةَ وَالتَّدْرِيبَ عَلَى الكَلِمَاتِ الصَّعْبَةِ فِي دَفْتَرِهِ. دَائِمًا كَانَ\nيَمْتَدِحُهُ مُعَلِّمُوهِ."}, {"n": 15, "img": "الأمانة/images/p015.png", "w": 1654, "h": 2339, "words": 34, "diac": 0.724, "score": null, "text": "كَانَ «هَانِي» زَمِيلُ «هَادِي» فِي الصَّفِّ ضَعِيفًا فِي التَّهْجِئَةِ. أَخْبَرَهُ\nالسَّيِّدُ «حَاتِمٌ»: «هَانِي تَحْتَاجُ لأَنْ تَعْمَلَ بِجِدٍّ أَكْثَرَ. مِنَ الآنَ فَصَاعِدًا إِذَا\nتَهَجَّأْتَ الكَلِمَةَ بِالشَّكْلِ الصَّحِيحِ يَجِبُ عَلَيْكَ كِتَابَتُهَا عَشْرَةَ مَرَّاتٍ».\n| امتحان التهجئة"}, {"n": 16, "img": "الأمانة/images/p016.png", "w": 1654, "h": 2339, "words": 31, "diac": 0.699, "score": null, "text": "أَصْبَحَ «هَادِي» وَاثِقًا بِنَفْسِهِ لِدَرَجَةِ أَنَّهُ لَمْ يَتَدَرَّبَ لِلامْتِحَانِ التَّالِي. وَخِلالَ\nالامْتِحَانِ قَالَ السَّيِّدُ «حَاتِمُ»: يَا أَطْفَالُ، الآنَ اكْتُبُوا كَلِمَةَ «عُلُومٌ».\nاضْطَرَبَ «هَادِي»، وَلَمْ يَعْرِفِ التَّهْجِئَةَ الصَّحِيحَةَ لِلْكَلِمَةِ.\n\n| امتحان التهجئة"}, {"n": 17, "img": "الأمانة/images/p017.png", "w": 1654, "h": 2339, "words": 34, "diac": 0.803, "score": null, "text": "حَزِنَ وَفَكَّرَ وَقَالَ لِنَفْسِهِ: «إِنْ أَنَا كَتَبْتُ التَّهْجِئَةَ بِشَكْلٍ خَاطِئٍ لَنْ أَحْصُلَ\nعَلَى العَلَامَةِ التَّامَّةِ، وَبِذَلِكَ السَّيِّدُ «حَاتِمٌ» لَنْ يَمْتَدِحَنِي». فَكَّرَ أَنْ يَغُشَّ\nوَيَنْقُلَ الكَلِمَةَ مِنْ «هَانِي» الَّذِي يَجْلِسُ بِجَانِبِهِ.\nامتحان التهجئة | 15"}, {"n": 18, "img": "الأمانة/images/p018.png", "w": 1654, "h": 2339, "words": 46, "diac": 0.84, "score": null, "text": "فَجْأَةً، أَدْرَكَ «هَادِي» أَنَّهُ مُخْطِئٌ بِهَذَا وَفَكَّرَ «لَنْ أَغِشَّ حَتَّى لَوْ حَصَلْتُ\nعَلَى عَلَامَةٍ أَقَلَّ. سَأَعْمَلُ بِجِدٍّ فِي المَرَّةِ القَادِمَةِ لِأَحْصُلَ عَلَى العَلَامَةِ\nالكَامِلَةِ بِأَمَانَةٍ». كَانَ «هَادِي» سَعِيدًا؛ لِأَنَّهُ لَمْ يَغِشْ، وَوَعَدَ نَفْسَهُ أَيْضًا\nأَنْ يَتَدَرَّبَ أَكْثَرَ فِي المَرَّةِ القَادِمَةِ.\n\nالعِبْرَةُ: الأَمَانَةُ هِيَ مِنْ أَفْضَلِ المَبَادِئِ."}, {"n": 19, "img": "الأمانة/images/p019.png", "w": 1654, "h": 2339, "words": 30, "diac": 0.777, "score": null, "text": "لَا نُرِيدُ أَنْ نَدْرُسَ\nكَانَ «عُمَرُ» وَ«مُهَنَّدٌ» أَخَوَيْنِ. كَانَا ضَعِيفَيْنِ بِالدِّرَاسَةِ، وَلَا يُحِبَّانِ\nحُضُورَ المَدْرَسَةِ. اعْتَادَا كُلَّ صَبَاحٍ عِوَضًا عَنِ الذَّهَابِ لِلمَدْرَسَةِ أَنْ\nيَذْهَبَا إِلَى المُنْتَزَهِ أَوِ الحَدِيقَةِ للعبِ هُنَاكَ."}, {"n": 20, "img": "الأمانة/images/p020.png", "w": 1654, "h": 2339, "words": 27, "diac": 0.742, "score": null, "text": "فِي أَحَدِ الأَيَّامِ، وَكَالعَادَةِ قَضَيا اليَوْمَ كُلَّه، وَهُمَا يَلعَبَان فِي الحَدِيقَةِ وَعَادَا\nللمَنْزِلِ وَصَرَخَا: «أُمِّي، نَحْنُ جَائِعَان جِدًّا. مِنْ فَضْلِكِ نُرِيدُ شَيئًا لِنَأْكُلَهُ».\nقَدَّمَتْ أُمُّهُمَا الطَّعَامَ لَهُمَا."}, {"n": 21, "img": "الأمانة/images/p021.png", "w": 1654, "h": 2339, "words": 30, "diac": 0.718, "score": null, "text": "بَعْدَ الأَكْلِ خَرَجَ كِلَاهُمَا وَبَدَءَا اللَّعِبَ\nبِالكُرَةِ. أَتَتْ وَالِدَتُهُمَا وَقَالَتْ «يَا أَوْلادُ\nلَعِبْتُمَا بِمَا فِيهِ الكِفَايَةُ. الآنَ هَلْ لَدَيْكُمَا\nوَظِيفَةٌ». كَذِبَ «عُمَرُ» وَ«مُهَنَّدُ»:\n«أُمِّي لَيْسَ لَدَيْنَا أَيُّ فروض منزلية\nاليَومَ»."}, {"n": 22, "img": "الأمانة/images/p022.png", "w": 1654, "h": 2339, "words": 31, "diac": 0.789, "score": null, "text": "فِي المَسَاءِ جَاءَ «بَشِيرٌ» رَفِيقُهُما فِي الصَّفِّ إِلَى\nمَنْزِلِهمَا. سَلَّمَ عَلَى أُمِّهِمَا وَقَالَ: «خَالَةُ، هَلْ «عُمَرُ»\nوَ«مُهَنَّدٌ» يُعَانِيَانِ مِنْ شَيْءٍ؟» أَجَابَتِ الأُمُّ: «هُمَا\nبِخَيْرٍ. لِمَاذَا؟» أَخْبَرَهَا «بَشِيرٌ» عَنْ غِيَابِهِمَا عَنِ\nالمَدْرَسَةِ."}, {"n": 23, "img": "الأمانة/images/p023.png", "w": 1654, "h": 2339, "words": 32, "diac": 0.833, "score": null, "text": "نَادَتْهُمَا أُمُّهُمَا وَقَالَتْ: «أَبْنَائِي، عَرَفْتُ أَنَّكُمَا كُنْتُمَا تَكْذِبَانِ عَلَيَّ. وَيَجِبُ\nأَلَّا تَكْذِبَا أَبَدًا. إِنَّهَا خَسَارَةٌ لَكُمَا إِنْ لَمْ تَذْهَبَا لِلمَدْرَسَةِ». أَدْرَكَا خَطَأَهُمَا\nوَوَعَدَا أَنْ يَكُونَا صَادِقَيْنِ.\n\nالعِبْرَةُ: كُنْ صَادِقًا، وَلَا تَكْذِبْ أَبَدًا."}, {"n": 24, "img": "الأمانة/images/p024.png", "w": 1654, "h": 2339, "words": 30, "diac": 0.745, "score": null, "text": "لِمَنْ هَذِهِ النُّقُودُ؟\n\n«نَانْسِي» الأُخْتُ الْكُبْرَى «لِرُوبِي». وَفِي أَحَدِ الأَيَّامِ قَالَتْ لَهَا: «رُوبِي\nدَعِيْنَا نَذْهَبْ لِشِرَاءِ طَاوِلَةٍ لِلدِّرَاسَةِ لَنَا». ذَهَبَتَا إِلَى مَتْجَرٍ يَبِيعُ الأَثَاثَ\nالمُسْتَعْمَلَ. اشْتَرَتْ «نَانْسِي» طَاوِلَةً بِثَلَاثَةِ أَدْرَاجٍ."}, {"n": 25, "img": "الأمانة/images/p025.png", "w": 1654, "h": 2339, "words": 35, "diac": 0.65, "score": null, "text": "عِنْدَمَا وَصَلَتَا المَنْزِلَ قَالَتْ «رُوبِي» الصَّغِيرَةُ: «نَانْسِي سَأَضَعُ القِرْطَاسِيَّةَ\nالخَاصَّةَ بِي فِي أَحَدِ الأَدْرَاجِ». وَافَقَتْ «نَانْسِي». عِنْدَمَا فَتَحَتْ «رُوبِي»\nالدُّرْجَ أُصِيبَتْ بِالدَّهْشَةِ: «أوه «نَانْسِي»! انْظُرِي! يُوجَدُ نُقُودٌ هُنَا».\nفَعَادَتَا إِلَى المَتْجَرِ.\n| لمن هذه النقود؟"}, {"n": 26, "img": "الأمانة/images/p026.png", "w": 1654, "h": 2339, "words": 35, "diac": 0.756, "score": null, "text": "قَالَ صَاحِبُ المَتْجَرِ: «لا بُدَّ أَنَّ هَذِهِ النُّقُودَ لِلسَّيِّدَةِ العَجُوزِ الَّتِي بَاعَتْنِي\nهَذِهِ الطَّاوِلَةَ». نَادَاهَا وَقَامَتْ «رُوبِي» بِإِعَادَةِ النُّقُودِ لَهَا. كَانَتِ السَّيِّدَةُ\nالعَجُوزُ سَعِيدَةً جِدًّا بِإِعَادَةِ النُّقُودِ. وَشَكَرَتِ الفَتَاتَيْنِ عَلَى أَمَانَتِهِمَا.\n\nالعِبْرَةُ: عَدَمُ الأَمَانَةِ شَرٌّ."}]}, {"key": "الأنانية", "title": "الأنانية", "pages": [{"n": 1, "img": "الأنانية/images/p001.png", "w": 1700, "h": 2200, "words": 6, "diac": 0.645, "score": null, "text": "قيمي\nالأَنَانِيَّةُ\nبِنَاءُ شَخْصِيَتِك و مُعْتَقَدَاتِك"}, {"n": 2, "img": "الأنانية/images/p002.png", "w": 1654, "h": 2339, "words": 161, "diac": 0.08, "score": null, "text": "قيمي\nالأَنَانِيَّةُ\n\nإن تعليمك لأبنائك أهمية أن يكونوا غير أنانيين، بالتأكيد سوف يجعل منهم أباءً أفضل عندما يكبرون. ستساعد\nهذه القصص القصيرة في تنمية حس الكرم، والعطاء ، والتضحية، وروح الشفقة. سوف يتعلم من هذه القصص\nالقصيرة سهلة الفهم قيمة عدم الأنانية وتشجعه على أن يكون إنسانًا واضحًا، يفكر في الآخرين.\n\nكل العناوين في هذه السلسلة\n\nقيمي\nالأَمَانَةُ\nبناء شخصيتك و معتقداتك\nمؤسسة حورس الدولية\n\nقيمي\nالتَّعَاطُفُ\nبناء شخصيتك و معتقداتك\nمؤسسة حورس الدولية\n\nقيمي\nالشَّجَاعَةُ\nبناء شخصيتك و معتقداتك\nمؤسسة حورس الدولية\n\nقيمي\nالصَّبْرُ\nبناء شخصيتك و معتقداتك\nمؤسسة حورس الدولية\n\nقيمي\nالغَضَبُ و الجِدَالُ\nبناء شخصيتك و معتقداتك\nمؤسسة حورس الدولية\n\nقيمي\nالقَنَاعَةُ\nبناء شخصيتك و معتقداتك\nمؤسسة حورس الدولية\n\nقيمي\nقُوَّةُ الكَلِمَةِ\nبناء شخصيتك و معتقداتك\nمؤسسة حورس الدولية\n\nقيمي\nالأَنَانِيَّةُ\nبناء شخصيتك و معتقداتك\nمؤسسة حورس الدولية\n\nقيمي\nالتَّسَامُحُ\nبناء شخصيتك و معتقداتك\nمؤسسة حورس الدولية\n\nقيمي\nالغَيْرَةُ\nبناء شخصيتك و معتقداتك\nمؤسسة حورس الدولية\n\nI.S.B.N\n978-977-368-637-6\n9789773686376\nFu 2 earn\nالريّادة\nللدراسات والنشر\nمؤسسة حورس الدولية"}, {"n": 3, "img": "الأنانية/images/p003.png", "w": 1654, "h": 2339, "words": 104, "diac": 0.208, "score": null, "text": "قِيَمِي\nاَلْأَنَانِيَّةُ\nالمُحْتَوَىٰ\n6 - 2\t الحَدِيقَةُ الفَاتِنَةُ\n11 - 7\t الفَتَى الصَّغِيرُ وَنُقُودُهُ\n16 - 12\t أَفْضَلُ صَدِيقَيْنِ\n21 - 17\t الحَمَامُ الأَنَانِي\n24 - 22\t الحِصَانُ الأَنَانِي\nترجمة كتاب : values for me\nبتصريح من شركة : future books\nthis edition has been produced with a subsidy by the spotlight on\nright programme in Abu Dhabi\nالناشر : مؤسسة حورس الدولية للنشر والتوزيع\nالريادة للنشر والطباعة - دبي - الأمارات العربية المتحدة\nرقم الإيداع بدار الكتب : 14817\nالترقيم الدولي I.S.B.N : 978 - 977 - 368 - 638 - 3\nجميع الحقوق محفوظة لمؤسسة حورس الدولية للنشر والتوزيع\nطبعة : 2019"}, {"n": 4, "img": "الأنانية/images/p004.png", "w": 1654, "h": 2339, "words": 23, "diac": 0.723, "score": null, "text": "اَلحَدِيقَةُ الفَاتِنَةُ\n\nيَمْلِكُ رَجُلٌ غَنِيٌّ حَدِيقَةً جَمِيلَةً وَرَائِعَةً. فِيهَا الكَثِيرُ مِنَ\nالأَزْهَارِ وَالنَّبَاتَاتِ وَالأَشْجَارِ الفَاتِنَةِ. يُغَرِّدُ فِيهَا العَصَافِيرُ\nبِعُذُوبَةٍ وَتُحَلِّقُ الفَرَاشَاتُ حَوْلَهَا بِانْسِيَابٍ."}, {"n": 5, "img": "الأنانية/images/p005.png", "w": 1654, "h": 2339, "words": 24, "diac": 0.663, "score": null, "text": "اعْتَادَتْ مَجْمُوعَةٌ مِنَ الأَطْفَالِ اللَّعِبَ فِيهَا فِي كُلِّ يَوْمٍ. لم يَكُنِ\nالرَّجُلُ الغَنِيُّ يَعْرِفُ ذَلِكَ؛ لأَنَّهُ فِي أَغْلَبِ الأَحْيَانِ يَكُونُ خَارِجَ\nالمَنْزِلِ.\nالحديقة الفاتنة"}, {"n": 6, "img": "الأنانية/images/p006.png", "w": 1654, "h": 2339, "words": 35, "diac": 0.652, "score": null, "text": "وَفِي أَحَدِ الأَيَّامِ بَيْنَمَا الأَطْفَالُ يَلْعَبُونَ فِي الحَدِيقَةِ عَادَ الرَّجُلُ\nإِلَى مَنزِلِهِ، وَعِنْدَمَا رَأَى الأَولادَ فِي الحَدِيقَةِ صَرَخَ: «كَيْفَ\nتَتَجَرَّأُونَ وَتَدْخُلُونَ حَدِيقَتِي دُونَ إِذْنِي، اذْهَبُوا بَعِيدًا!\nوَلَا تَتَجَرَّأُوا عَلَى المَجِيءِ مَرَّةً أُخْرَى».\n| الحديقة الفاتنة"}, {"n": 7, "img": "الأنانية/images/p007.png", "w": 1654, "h": 2339, "words": 33, "diac": 0.669, "score": null, "text": "بَنَى الرَّجُلُ جِدَارًا عَالِيًّا حَوْلَ الحَدِيقَةِ، وَبِذَلِكَ لَنْ يَسْتَطِيعَ الأَطْفَالُ الفُقَرَاءُ\nاللَّعِبَ فِيهَا بَعْدَ اليَوْمِ. حَالًا بَدَأَتِ الحَدِيقَةُ تَفْقِدُ جَمَالَهَا، وَبَدَأَتِ الأَزْهَارُ\nتَذْبُلُ وَالأَشْجَارُ لم تَعُدْ تُزْهِرُ، وَتَوَقَّفَتِ العَصَافِيرُ عَنِ الغِنَاءِ.\nالحديقة الفاتنة"}, {"n": 8, "img": "الأنانية/images/p008.png", "w": 1654, "h": 2339, "words": 35, "diac": 0.788, "score": null, "text": "عَرَفَ الرَّجُلُ خَطَأَهُ، فَفِي أَحَدِ الأَيَّامِ فَتَحَ بَوَّابَةَ حَدِيقَتِهِ وَنَادَى الْأَطْفَالَ؛\nلِيَدْخُلُوا، قَالَ لَهُمْ: «الحَدِيقَةُ تَنْتَظِرُكُمْ، ادْخُلُوا وَالْعَبُوا». حَالَمَا\nدَخَلَ الْأَطْفَالُ الحَدِيقَةَ أَصْبَحَتْ أَكْثَرَ جَمَالًا مَرَّةً أُخْرَى.\n\nالعِبْرَةُ: يَجِبُ أَنْ نُفَكِّرَ بِالآخَرِينَ، كَمَا نُفَكِّرَ بِأَنْفُسِنَا."}, {"n": 9, "img": "الأنانية/images/p009.png", "w": 1654, "h": 2339, "words": 19, "diac": 0.789, "score": null, "text": "اَلفَتَى الصَّغِيرُ وَنُقُودُهُ\n«سِرَاجُ» وَ«سَعِيدُ» وَلَدَانِ يَعِيشَانِ بِسَعَادَةٍ مَعَ وَالِدَيْهُمَا اللَّذَيْنِ لَم يَكُونَا\nغَنِيَّيْنِ كَثِيرًا، لَكِنْ يُحِبَّانِ أَطْفَالَهُمَا جِدًّا."}, {"n": 10, "img": "الأنانية/images/p010.png", "w": 1654, "h": 2339, "words": 32, "diac": 0.724, "score": null, "text": "فِي أَحَدِ الأَيَّامِ رَأَى «سِراجٌ» أَنَّ «سَعِيدَ» يَقُومُ بِوَضْعِ نُقُودٍ دَاخِلَ صُنْدُوقٍ\nفَسَأَلَهُ: «لِمَاذَا تَجْمَعُ النُّقُودَ؟» أَجَابَهُ «سَعِيدٌ»: «أَنَا أَدَّخِرُ النُّقُودَ مُنْذُ سِتَّةِ\nأَشْهُرٍ لِكَي أَشْتَرِيَ دَرَّاجَةً».\n8 | الفتى الصغير ونقوده"}, {"n": 11, "img": "الأنانية/images/p011.png", "w": 1654, "h": 2339, "words": 25, "diac": 0.658, "score": null, "text": "فِي ذَلِكَ المَسَاءِ مَرِضَ «سِرَاجُ» فَأَخَذَهُ \nوَالِدَاهُ إِلَى الطَّبِيبِ، قَالَ لَهُمْ: «سَيَكُونُ بِخَيْرٍ، \nلِذَلِكَ أَرْجُو مِنْكُمْ دَفْعَ التَّكالِيفِ الطِّبِّيَّةِ لِلبَدْءِ \nبِالعِلاجِ». \n| الفتى الصغير ونقوده"}, {"n": 12, "img": "الأنانية/images/p012.png", "w": 1654, "h": 2339, "words": 21, "diac": 0.756, "score": null, "text": "قَالَ الأَبُ بِحُزْنٍ لِزَوْجَتِهِ «لا أَمْلِكُ المَالَ لَدَفْعِ تَكَالِيفِ عِلَاجِ «سِرَاجِ»،\nمَاذَا سَنَفْعَلُ؟» سَمِعَ «سَعِيدٌ» كَلَامَ وَالِدِ «سِرَاجٍ»، فَرَكَضَ إِلَى البَيْتِ."}, {"n": 13, "img": "الأنانية/images/p013.png", "w": 1654, "h": 2339, "words": 41, "diac": 0.77, "score": null, "text": "عَادَ وَمَعَهُ صُنْدُوقُ النُّقُودِ وَأَعْطَاهَا لِوَالِدِهِ، وَقَالَ: «كُنْتُ أَدَّخِرُ النُّقُودَ\nلِشِرَاءِ دَرَّاجَةٍ. لَكِنَّ هَذَا لَيْسَ أَكْثَرَ أَهَمَّيَّةَ مِنْ «سِرَاجِ». لَو سَمَحْتَ خُذِ\nالنُّقُودَ». شَعَرَ الوَالِدانِ بِالفَخْرِ وَدَمَعَتْ أَعْيُنُهُمَا.\n\nالعِبْرَةُ: أَحْيَانًا يَجِبُ عَلَيْنَا أَنْ نُضَحِّي\nمِنْ أَجْلِ مَنْ نُحِبُّ.\n\nالفتى الصغير ونقوده"}, {"n": 14, "img": "الأنانية/images/p014.png", "w": 1654, "h": 2339, "words": 19, "diac": 0.82, "score": null, "text": "أَفْضَلُ صَدِيقَيْنِ\nكَانَ «حَسَنُ» وَ«آدَمُ» أَفْضَلَ صَدِيقَيْنِ، دَرَسَا بِالمَدْرَسَةِ ذَاتِهَا. كُلُّ يَومٍ\nكَانَا يَذْهَبَانِ لِلمَدْرَسَةِ مَعَ بَعْضِهِمَا عَلَى دَرَّاجَتَيْهِمَا."}, {"n": 15, "img": "الأنانية/images/p015.png", "w": 1654, "h": 2339, "words": 36, "diac": 0.792, "score": null, "text": "فِي أَحَدِ الأَيَّامِ، خِلَالَ عَودَتِهِمَا مِنَ المَدْرَسَةِ انْثَقَبَ إِطَارُ دَرَّاجَةِ «حَسَن»،\nوَكَانَ لَدَى «حَسَن» مُبَارَاةُ كِرِكِيتٍ مُهِمَّةٌ جدًّا. عِنْدَمَا رَأَى ذَلِكَ «آدَمُ»\nقَالَ «لَحَسَن»: يُمْكِنُكَ أَخْذُ دَرَّاجَتِي وَسَآخُذُ دَرَّاجَتَكَ\nلِتَصْلِيحِهَا. شَكَرَ «حَسَنْ» «آدَمَ» وَذَهَبَ إِلَى المُبَارَاةِ."}, {"n": 16, "img": "الأنانية/images/p016.png", "w": 1654, "h": 2339, "words": 29, "diac": 0.702, "score": null, "text": "أَخَذَ «آدَمُ» دَرَّاجَةَ «حَسَن» وَعَادَ إِلَى البَيْتِ، في المَسَاءِ ذَهَبَ إِلَى مَنْزِلِ\n«حَسَن»، قَالَ لَهُ: «شُكْرًا جَزِيلًا «حَسَن»، وَصَلْتَ عَلَى الوَقْتِ وَفُزْتُ\nبِالمُبَارَاة، بِالمُنَاسَبَة هَلْ جَهَّزتَ نَفْسَكَ لامْتِحَانَاتِ الغَدِ؟»."}, {"n": 17, "img": "الأنانية/images/p017.png", "w": 1654, "h": 2339, "words": 27, "diac": 0.798, "score": null, "text": "اسْتَغْرَبَ «آدَمُ»، «أَيُّ امْتِحَانٍ؟» أَجَابَهُ «حَسَنٌ»: «امْتِحَانُ التَّهْجِئَةِ».\nصَاحَ بِصَوْتٍ عَالٍ: «أُوهْ! نَسِيتُ تَمَامًا. وَتَهْجِئَتِي ضَعِيفَةٌ، مَاذَا سَأَفْعَلُ\nالآنَ؟» أَخْبَرَهُ «حَسَنٌ»: «لَا تَقْلَقْ سَأُسَاعِدُكَ». وَدَرَسَا مَعَ بَعْضِهِمَا."}, {"n": 18, "img": "الأنانية/images/p018.png", "w": 1654, "h": 2339, "words": 23, "diac": 0.752, "score": null, "text": "فِي اليَومِ التَّالِي، قَدَّمَ «آدَمُ» الامْتِحَانَ بِشَكْلٍ مُمْتَازٍ وَحَصَلَ هُوَ وَ«حَسَنُ»\nعَلَى العَلامَاتِ التَّامَّةِ. أَثْنَىَ عَلَيْهِمَا مُعَلِّمُ الصَّفِّ.\n\nالعِبْرَةُ: سَاعِدْ أَصْدِقَاءَكَ فِي المِحَنِ."}, {"n": 19, "img": "الأنانية/images/p019.png", "w": 1654, "h": 2339, "words": 15, "diac": 0.652, "score": null, "text": "الحَمَامُ الأَنَانِي\n\nكَانَ يَامَا كَانَ، كَانَتْ هُنَاكَ شَجَرَةُ تِينٍ كَبِيرَةٌ يَعِيشُ عَلَيْهَا العَدِيدُ مِنَ\n\nالحَمَامِ."}, {"n": 20, "img": "الأنانية/images/p020.png", "w": 1654, "h": 2339, "words": 28, "diac": 0.721, "score": null, "text": "فِي أَحَدِ الأَيَّامِ، وبَيْنَمَا كَانَتِ السَّمَاءُ تُمْطِرُ بِغَزَارَةٍ عَادَتْ عُصْفُورَةُ\nالدُّورِي إِلَى عُشِّهَا. شَاهَدَتْ شَجَرَةَ التِّينِ وَفَكَّرَتْ: «مِنَ\nالأَفْضَلِ أَنْ أَبْقَىَ هُنَا حَتَّى يَتَوَقَّفَ المَطَرُ».\n| الحمام الأناني"}, {"n": 21, "img": "الأنانية/images/p021.png", "w": 1654, "h": 2339, "words": 33, "diac": 0.691, "score": null, "text": "عِنْدَمَا شَاهَدَ الحَمَامُ عُصْفُورَةَ الدُّورِي صَرَخُوا: «هَذِهِ الشَّجَرَةُ لَنَا!\nارْحَلِي مِنْ هُنَا وَإِلَّا قَتَلْنَاكِ». تَوَسَّلَتْ إِلَيْهِم العُصْفُورَةُ كَثِيرًا، لَكِنَّ الحَمَامَ\nالأَنَانِي لَمْ يَسْمَعْهَا، فَطَارَتِ العُصْفُورَةُ نَحْوَ شَجَرَةٍ قَرِيبَةٍ وَاحْتَمَتْ فِي\nجَوْفِهَا.\nالحمام الأناني"}, {"n": 22, "img": "الأنانية/images/p022.png", "w": 1654, "h": 2339, "words": 24, "diac": 0.72, "score": null, "text": "أَمْطَرَتِ السَّمَاءُ بِغَزَارَةٍ، وَهَبَّتْ عَاصِفَةٌ قَوِيَّةٌ أَدَّتْ إِلَىٰ كَسْرِ أَعْصَانِ\nشَجَرَةِ التِّينِ؛ حَيْثُ كَانَ الحَمَامُ يَحْتَمِي. وَشَعَرَ الحَمَامُ بِعَدَمِ الأَمَانِ فِيهَا.\n| الحمام الأناني"}, {"n": 23, "img": "الأنانية/images/p023.png", "w": 1654, "h": 2339, "words": 33, "diac": 0.75, "score": null, "text": "كَانَتْ عُصْفُورَةُ الدُّورِي تَنْظُرُ إِلَيْهِمْ مِنْ عَلَى بُعْدٍ ، نَادَتْهُمْ: «أَصْدِقَائِي\nالأَعِزَّاء! تَعَالَوُا إِلَى هَذِهِ الفَتْحَةِ». طَارَ الحَمَامُ بِاتِّجَاهِ الفَتْحَةِ، وَاعْتَذَرُوا\nعَنْ أَنَانِيتِهِمْ، وَوَعَدُوا أَنْ يُحَسِّنُوا مِنْ طَرِيقَةِ تَعَامُلِهِمْ.\n\nالعِبْرَةُ: الأَنَانِيَّةُ تَقُودُ لِلمُشْكِلَاتِ."}, {"n": 24, "img": "الأنانية/images/p024.png", "w": 1654, "h": 2339, "words": 39, "diac": 0.676, "score": null, "text": "الحِصَانُ الأَنَانِيُّ\n\nفِي أَحَدِ الأَيَّامِ كَانَ هُنَاكَ تَاجِرٌ يَعِيشُ فِي قَريَةٍ صَغِيرَةٍ. كَانَ لَدَيْهِ حِصَانٌ\nوَحِمَارٌ. وفِي أَحَدِ الأَيَّامِ، ذَهَبَ التَّاجِرُ فِي رِحْلَةٍ وَوَضَعَ حِمْلًا ثَقِيلًا عَلَى\nظَهْرِ الحِمَارِ. الحِمَارُ المِسْكِينُ كَانَ يَتَحَرَّكُ بِصُعُوبَةٍ بِسَبَبِ هَذَا العِبْءِ.\n\nالحصان الأناني"}, {"n": 25, "img": "الأنانية/images/p025.png", "w": 1654, "h": 2339, "words": 40, "diac": 0.739, "score": null, "text": "فِي مُنْتَصَفِ الرِّحْلَةِ، طَلَبَ الحِمَارُ مِنَ الحِصَانِ: «لَوْ سَمَحْتَ سَاعِدْنِي\nبِهَذِهِ الحُمُولَةِ. يُمْكِنُ بِسُهُولَةٍ حَمْلَ بَعْضِهَا عَلَى ظَهْرِكِ».\nلَكِنَّ الحِصَانَ الأَنَانِيَّ رَفَضَ مُسَاعَدَتِهِ. تَابَعَ الحِمَارُ\nالمِسْكِينُ طَرِيقَهُ بِخُطَىً مُتَثَاقِلَةٍ. بَدَأَ يَشْعُرُ بِالتَّعَبِ\nجِدًّا حَتَّى وَقَعَ عَلَى الأَرْضِ.\n\n| الحصان الأناني"}, {"n": 26, "img": "الأنانية/images/p026.png", "w": 1654, "h": 2339, "words": 30, "diac": 0.71, "score": null, "text": "عِنْدَمَا شَاهَدَ التَّاجِرُ الحِمَارَ وَقَدْ سَقَطَ عَلَى الأَرْضِ، قَالَ للحِصَانِ: «الآنَ\nالحِمَارُ لا يَسْتَطِيعُ المَشْيَ أَبَدًا يَجِبُ عَلَيْكَ أَنْ تَحْمِلَ\nالحِمْلَ». تَأَسَّفَ الحِصَانُ عَلَى أَنَانِيَّتِهِ.\n\nالعِبْرَةُ: الأَنَانِيَّةُ تُؤَدِّي إِلَى المُعَانَاةِ."}]}, {"key": "التعاون", "title": "التعاون", "pages": [{"n": 1, "img": "التعاون/images/p001.png", "w": 3350, "h": 2339, "words": 103, "diac": 0.019, "score": null, "text": "سلسلة قيمي التربوية\nالتَّعَاوُنُ\nبناء شخصيتك و معتقداتك\n\nالتّعَاوُنُ\nالحياة تكون أروع وأجمل عبر التعاون وليس الصراع ، هذا هو أكبر نجاح يمكن أن يحقق. دورك كأب أو أم أن\nتكون على علم بأهمية تعليم طفلك أهمية التعاون بالنسبة له، من حيث هو لا يؤدي فقط إلى السعادة، الحياة\nالناجحة، لكنه سيشعر بنتائجه في عالم متناغم. فلتكن هذه القصص القصيرة وسيلتك في تعليمه كيف يعمل في\nتناغم من الآخرين وكيف يتعاون معهم لتكون الحياة أجمل وأفضل.\n\nكل العناوين في هذه السلسلة\n\nالذكاء\nالثقة\nالتعاون\nالمشاركة\nالاجتهاد\nدقة المواعيد\nالعادات الجيدة\nحسن الخلق\nالصداقة\nالطاعة\n\nI.S.B.N\n978-977-368-637-6\n9789773686376\nالريادة\nللدراسات والنشر\nمؤسسة حورس الدولية"}, {"n": 2, "img": "التعاون/images/p002.png", "w": 1654, "h": 2339, "words": 108, "diac": 0.223, "score": null, "text": "سِلسِلَةَ قِيَمِي التربوية\n\nالتعاوُنُ\n\nالمُحتَوَى\n\nالشُّورَبَةُ السَّحرِيَّةُ 6 - 2\nالشَّمَنْدَرُ الأَحْمَرُ الكَبِيرُ 11 - 7\nطَارِقُ وَالعَجُوزُ 16 - 12\nالصَّلَاةُ مِنْ أَجْلِ المَطَرِ 21 - 17\nالضَّرِيرُ وَالأَعْرَجُ 24 - 22\n\nترجمة كتاب : values for me\nبتصريح من شركة : future books\nthis edition has been produced with a subsidy by the spotlight on\nright programme in Abu Dhabi\nالناشر : مؤسسة حورس الدولية للنشر والتوزيع\nالريادة للنشر والطباعة - دبي - الأمارات العربية المتحدة\nرقم الإيداع بدار الكتب : 14804\nالترقيم الدولي I.S.B.N : 978 - 977 - 368 - 625 - 3\nجميع الحقوق محفوظة لمؤسسة حورس الدولية للنشر والتوزيع\nطبعة : 2023"}, {"n": 3, "img": "التعاون/images/p003.png", "w": 1654, "h": 2339, "words": 37, "diac": 0.821, "score": null, "text": "اَلشُّوْرَبَةُ السَّحْرِيَّةُ\n\nفِيمَا مَضَى كَانَتْ هُنَاكَ مَجَاعَةٌ فِي إِحْدَى الْبَلْدَاتِ. كَانَ النَّاسُ جِيَاعًا،\nوَيَحْرُسُونَ الطَّعَامَ القَلِيلَ المُتَبَقِّي لَدَيْهِمْ مِنْ أَنْ يُسْرَقَ. فِي إِحْدَى الأُمْسِيَّاتِ،\nقَدِمَ شَابٌّ إِلَى تِلْكَ البَلْدَةِ، وَلَكِنْ لَمْ يُرَحِّبْ أَحَدٌ بِهِ، أَوْ يَتَكَلَّمْ مَعَهُ."}, {"n": 4, "img": "التعاون/images/p004.png", "w": 1654, "h": 2339, "words": 41, "diac": 0.712, "score": null, "text": "أَخْرَجَ هَذَا الشَّابُّ قِدْرًا كَبِيرًا مِنْ حَقِيبَتِهِ وَمَلَأَهُ بِالمَاءِ. بَعْدَ ذَلِكَ جَمَعَ\nبَعْضَ الحَصَى وَصَرَخَ بِحَيْثُ سَمِعَهُ كُلُّ أَهْلِ البَلْدَةِ،\n«يم يم!! اليَوْمَ سَأُحَضِّرُ شُورَبَةَ شَهِيَّةً بِسِحْرِ مِنْ\nهَذِهِ الحَصَى». وَضَعَ الحَصَىٰ في القِدْرِ، وَبَدَأَ المَاءُ\nبِالغَلَيَانِ .\n\n| الشوربة السحرية"}, {"n": 5, "img": "التعاون/images/p005.png", "w": 1654, "h": 2339, "words": 49, "diac": 0.728, "score": null, "text": "كَانَ الْفُضُولُ لَدَىَ الجَمِيع لِيَعْرِفُوا مَاذَا يَفْعَلُ هَذَا الشَّابُّ، اقْتَرَبُوا مِنْهُ؛\nلِيَرَوْا كَيْفَ يَصْنَعُ حِسَاءً مِنَ الحَصَى. بَعْدَ بِضْعِ مِنَ الوَقْتِ، تَذَوَّقَ الشَّابُّ\nالشُّوربَةَ، وَقَالَ بِصَوتٍ عَالٍ: «يَا لَهَا مِنْ شُوربَةٍ شَهِيَةِ المَذَاقِ، لَوْ فَقَطْ\nكَانَ لَدَيَّ بَصَلٌ فَأُضِيفُهُ لِلشُّورَبَةِ لَكَانَتْ أَشْهَىَ».\nأَعْطَاهُ رَجُلٌ عَجُوزٌ بَصَلَةً.\n| الشوربة السحرية"}, {"n": 6, "img": "التعاون/images/p006.png", "w": 1654, "h": 2339, "words": 31, "diac": 0.688, "score": null, "text": "وَبِالطَّرِيقَةِ نَفْسِهَا طَلَبَ الشَّابُّ البَطَاطَا، وَالجَزَرَ وَاللَّحْمَ وَالمَلْفُوفَ.\nأَعْطَاهُ النَّاسُ مَا طَلَبَ؛ لِأَنَّهُمْ يُرِيدُونَ تَذَوُّقَ الشُّورْبَةِ الشَّهِيَّةِ، بَعْدَ حِينٍ،\nدَعَا الشَّابُّ الجَمِيعَ: «تَعَالَوْا، الشُّورْبَةُ الآنَ جَاهِزَةٌ، دَعُونَا نَتَذَوَّقَهَا».\n| الشوربة السحرية"}, {"n": 7, "img": "التعاون/images/p007.png", "w": 1654, "h": 2339, "words": 42, "diac": 0.749, "score": null, "text": "أُعْجِبَ الجَمِيعُ بِالشُّورَبَةِ وَشَكَرُوا الشَّابَّ عَلَى هَذِهِ الشُّورَبَةِ السِّحْرِيَّةِ،\nقَالَ الشَّابُّ: «لا يُوجَدُ سِحْرٌ، لَوْ لَمْ يُعْطِ كُلُّ وَاحِدٍ فِيكُم القَلِيلَ لَكَانَ لَدَيْنَا\nفَقَط مَاءٌ سَاخِنٌ، وَبَعْضُ الحِجَارَةِ. «السِّحْرُ هُوَ التَّعَاوُنُ».\n\nالعِبْرَةُ: عِنْدَمَا يَعْمَلُ الفَرْدُ مَعَ الكُلِّ، فَكُلُّ فَرْدٍ يَرْبَحُ.\nالشَّوْرَبَة السحرية"}, {"n": 8, "img": "التعاون/images/p008.png", "w": 1654, "h": 2339, "words": 20, "diac": 0.609, "score": null, "text": "اَلشَّمَنْدَرُ الأَحْمَرُ الكَبِيرُ\nفِيمَا مَضَى زَرَعَ فَلَّاحٌ عَجُوزٌ بِذْرَةَ شَمَنْدَرٍ فِي حَدِيقَتِهِ، سَقَاهَا وَاعْتَنَى\nبِهَا يَومِيًّا.\n| الشمندر الأحمر الكبير"}, {"n": 9, "img": "التعاون/images/p009.png", "w": 1654, "h": 2339, "words": 23, "diac": 0.745, "score": null, "text": "وَحَالَمَا كَبُرَ الْبُرْعُمُ الصَّغِيرُ لِيُصْبِحَ شَمَنْدَرَةً قُرْمُزِيَّةً كَبِيرَةً، فَكَّرَ الْمُزَارِعُ\nأَنَّهُ يَجِبُ أَنْ يَسْحَبَ هَذِهِ الشَّمَنْدَرَةَ مِنَ الْأَرْضِ.\n8 | الشمندر الأحمر الكبير"}, {"n": 10, "img": "التعاون/images/p010.png", "w": 1654, "h": 2339, "words": 30, "diac": 0.72, "score": null, "text": "أَمْسَكَ الْمُزَارِعُ بِالشَّمَنْدَرَةِ مِنْ الأَعْلَىَ وَسَحَبَهَا بِكُلِّ مَا أُوْتِيَ مِنْ قُوَّةٍ، لكِنْ\nلَمْ يَسْتَطِعْ، طَلَبَ مِنْ زَوْجَتِهِ أَنْ تُسَاعِدَهُ، وَحَاوَلا مَعَ بَعْضِهِمَا سَحْبَهَا\nلَكِنْ عَبَثًا كَانَا يُحَاوِلانِ.\n\nالشمندر الأحمر الكبير"}, {"n": 11, "img": "التعاون/images/p011.png", "w": 1654, "h": 2339, "words": 17, "diac": 0.75, "score": null, "text": "نَادَى الْمُزَارِعُ عَائِلَتَهُ: «تَعَالَوْا يَا أَطْفَالِي، حَانَ الوَقْتُ لِنَعْمَلَ كُلُّنَا وَنَسْحَبَ\nهَذِهِ الشَّمَنْدَرَةَ الهَائِلَةَ». حَاوَلُوا جَمِيعُهُمْ سَحْبَهَا."}, {"n": 12, "img": "التعاون/images/p012.png", "w": 1654, "h": 2339, "words": 36, "diac": 0.676, "score": null, "text": "عِنْدَهَا انْخَلَعَتِ الشَّمَنْدَرَةُ مِنَ الْأَرْضِ. قَالَ الْمُزَارِعُ: «نَجَحْنَا عِنْدَمَا\nعَمِلْنَا مَعَ بَعْضٍ، تَعَالَوْا سَنَطْهُو حِسَاءَ الشَّمَنْدَرِ اللَّذِيذَ عَلَى العَشَاءِ هَذِهِ\nاللَّيْلَةِ». عَانَقَ أَفْرَادُ الأُسْرَةِ بَعْضَهُمْ البَعْض .\n\nالعِبْرَةُ: العَمَلُ الجَمَاعِيُّ\nدَائِمًا مُثْمِرٌ.\n\n| الشمندر الأحمر الكبير"}, {"n": 13, "img": "التعاون/images/p013.png", "w": 1654, "h": 2339, "words": 17, "diac": 0.711, "score": null, "text": "طَارِقُ وَالعَجُوزُ\n\nكَانَ «طَارِقُ» شَابًّا مُجِدًّا، يَقُومُ كُلَّ لَيْلَةٍ بِتَوْزِيعِ وَجَبَاتِ عَشَاءِ لِلنَّاسِ\nعَلَىٰ دَرَّاجَتِهِ.\n\nطارق والعجوز"}, {"n": 14, "img": "التعاون/images/p014.png", "w": 1654, "h": 2339, "words": 31, "diac": 0.752, "score": null, "text": "في إِحْدَى اللَّيَالِي طَرَقَ «طَارِقٌ» بَابَ أَحَدِ زَبَائِنِهِ، وَهُوَ السَّيِّدُ «مَحْمُود»،\nوَكَانَ رَجُلًا عَجُوزًا يَعِيشُ وَحِيدًا. لَمْ يُفْتَحْ أَحَدٌ البَابَ، فَنَادَى «طَارِقٌ»:\n«سَيِّد «مَحْمُود»، العَشَاءُ مِنْ أَجْلِكَ!» لَكِنْ\nلا أَحَدَ يَرُدُّ."}, {"n": 15, "img": "التعاون/images/p015.png", "w": 1654, "h": 2339, "words": 34, "diac": 0.872, "score": null, "text": "فَكَّرَ «طَارِقُ»: «يَجِبُ عَلَيَّ أَنْ أُسَلِّمَ وَجَبَاتِ العَشَاءِ، لِذَلِكَ يَجِبُ أَنْ\nأُغَادِرَ». بَدَأَ بِالمَشْيِ نَحْوَ دَرَّاجَتِهِ، فَجْأَةً فَكَّرَ: «لكِنْ مَاذَا لَوْ حَدَثَ مَكْرُوهٌ\nلِلسَّيِّدِ مَحْمُود». ذَهَبَ إِلَى السَّاحَةِ الخَلْفِيَّةِ لِلمَنْزِلِ، وَاخْتَلَسَ النَّظَرَ مِنَ\nالنَّافِذَةِ."}, {"n": 16, "img": "التعاون/images/p016.png", "w": 1654, "h": 2339, "words": 26, "diac": 0.776, "score": null, "text": "رَأَى «طَارِقُ» السَّيِّدَ «مَحْمُود» مُلْقَى عَلَى الأَرْضِ، نَظَرَ «طَارِقُ»\nحَوْلَهُ، فَوَجَدَ عَصَا أَمْسَكَهَا، وَضَرَبَ بِهَا زُجَاجَ النَّافِذَةِ. انْكَسَرَ الزُّجَاجُ\nوَدَخَلَ «طَارِقُ» إِلَى البَيْتِ، اتَّصَلَ مُبَاشَرَةً بِالإِسْعَافِ."}, {"n": 17, "img": "التعاون/images/p017.png", "w": 1654, "h": 2339, "words": 39, "diac": 0.8, "score": null, "text": "فِي الْمُسْتَشْفَى قَالَ السَّيِّدُ «مَحْمُود» إِنَّهُ سَقَطَ مِنْ عَلَى الدَّرَجِ وَأُغْمِيَ\nعَلَيْهِ، عِنْدَمَا أَتَى «طَارِقُ» لِزِيَارَتِهِ فِي المَشْفَى شَكَرَهُ السَّيِّدُ «مَحْمُودُ»:\n«شُكْرًا جَزِيلًا؛ لِأَنَّكَ أَنْقَذْتَ حَيَاتِي، بُنِي!» ابْتَسَمَ «طَارِقُ»، وَهُوَ يَشُدُّ\nعَلَى يَدِهِ.\n\nالعِبْرَةُ: تَعَاوَنْ مَعَ الآخَرِينَ فِي الشَّدَائِدِ."}, {"n": 18, "img": "التعاون/images/p018.png", "w": 1654, "h": 2339, "words": 20, "diac": 0.75, "score": null, "text": "الصَّلَاةُ مِنْ أَجْلِ المَطَرِ\n\nفِي يَوْمٍ مِنَ الأَيَّامِ كَانَتْ هُنَاكَ بُحَيْرَةٌ\nجَمِيلَةٌ وَسَطَ الغَابَةِ، يَعِيشُ فِيهَا\nالضَّفَادِعُ وَالجَرَادُ بِأُلْفَةٍ وَسَلَامٍ."}, {"n": 19, "img": "التعاون/images/p019.png", "w": 1654, "h": 2339, "words": 26, "diac": 0.663, "score": null, "text": "مَضَىَ وَقْتٌ طَوِيلٌ وَلَمْ تُمْطِرْ فِي تِلْكَ الغَابَةِ\nمِمَّا أَصَابَهَا بِالجَفَافِ. وَجَفَّتِ البُحَيْرَةُ، وَلَمْ يَبْقَ\nفِيهَا أَي شَيءٍ إِلا بِرْكَاتٌ مِنَ الطِّينِ.\nالصَّلاة من أجل المطر"}, {"n": 20, "img": "التعاون/images/p020.png", "w": 1654, "h": 2339, "words": 19, "diac": 0.732, "score": null, "text": "الضُّفْدَعُ العَجُوزُ الحَكِيمُ نَصَحَ قَائِلًا: «قَالَ\nأَجْدَادُنَا إِذَا صَلَّيْنَا للهِ فَسَوْفَ يُسَاعِدُنَا».\nتَجَمَّعَ الضَّفَادِعُ حَوْلَ البُحَيْرَةِ الجَافَّةِ، وَبَدَأُوا\nالصَّلَاةَ."}, {"n": 21, "img": "التعاون/images/p021.png", "w": 1654, "h": 2339, "words": 26, "diac": 0.67, "score": null, "text": "لَمْ تُمْطِرْ. أَتَتْ غَيْمَةٌ نَحْوَهُمْ،\nوَقَالَتْ: «صَلَاتُكُمْ لَيْسَتْ قَوِيَّةً بِمَا\nيَكْفِي لِتَصِلَ لله». سَمِعَ الجَرَادُ\nذلِكَ، فَذَهَبُوا إِلى الضَّفَادِعِ،\nوَقَالُوا: «سَنُصَلِّي مَعًا».\nالصلاة من أجل المطر"}, {"n": 22, "img": "التعاون/images/p022.png", "w": 1654, "h": 2339, "words": 35, "diac": 0.679, "score": null, "text": "عِنْدَهَا اسْتَجَابَ اللهُ لِدُعَائِهِمْ وَبَدَأَ المَطَرُ يَهْطُلُ\nغَزِيرًا وَامْتَلَأَتْ البُحَيرَةُ مَرَّةً أُخْرَى بِالمَاءِ النَّقِي.\nوَعَاشَ الضَّفَادِعُ وَالجَرَادُ بِسَعَادَةٍ بَعْدَ ذَلِكَ.\n\nالعِبْرَةُ: كُلَّمَا كَانَ العَمَلُ جَمَاعِيًّا، كُلَّمَا\nشَعَرْتَ بِالسَّعَادَةِ أَكْثَر.\n\n21 | الصلاة من أجل المطر"}, {"n": 23, "img": "التعاون/images/p023.png", "w": 1654, "h": 2339, "words": 21, "diac": 0.707, "score": null, "text": "اَلضَّرِيرُ وَالأَعْرَجُ\nكَانَ «كَرِيمٌ» وَ«نَبِيلٌ» صَدِيقَيْنِ، كَانَ «كَرِيمٌ» ضَرِيرًا، وَ«نَبِيلٌ»\nأعْرَجَ، عَاشَا مَعًا فِي القَرْيَةِ. وَفِي أَحَدِ الأَيَّامِ ذَهَبَا إِلَى الغَابَةِ."}, {"n": 24, "img": "التعاون/images/p024.png", "w": 1654, "h": 2339, "words": 38, "diac": 0.708, "score": null, "text": "اِشْتَعَلَتِ النَّارُ بِالغَابَةِ ، فَقَالَ «نَبِيلُ»: «الآنَ مَاذَا\nسَنَفْعَلُ «كَرِيم»؟ لَا أَسْتَطِيعُ المَشْيَ بِسُرْعَةٍ، وَأَنْتَ\nلَا تَسْتَطِيعُ أَنْ تَرَى، سَنَمُوتُ». أَجَابَهُ «كَرِيمٌ»: «لَا\nتَقْلَقْ! يَجِبُ أَنْ يُسَاعِدَ بَعْضُنَا بَعْضًا. سَأَكُونُ عُيُونَكَ\nلِأُسَاعِدَكَ بِالنَّظَرِ بَيْنَمَا تُسَاعِدُنِي بِالمَشْيِ».\nالضرير والأعرج"}, {"n": 25, "img": "التعاون/images/p025.png", "w": 1654, "h": 2339, "words": 24, "diac": 0.703, "score": null, "text": "حَمَلَ «كَرِيمُ» الضَّرِيرُ «نَبِيلَ» عَلَى كَتِفَيْهِ، الَّذِي بِدَوْرِهِ أَرْشَدَهُ عَلَى\nالطَّرِيقِ، بِمَسَاعَدَةِ بَعْضِهِمَا لِبَعْضٍ غَادَرَا الغَابَةَ بِسَلَامَةٍ.\n\nالعِبْرَةُ: التَّعَاوُنُ يُؤَدِّي لِلنَّجَاحِ.\n\n| الضرير والأعرج"}]}];
